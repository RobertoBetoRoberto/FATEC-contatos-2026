<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro Acessivel</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <h1>Cadastro</h1>
  <div class="div-form">
    <form action="">

      <fieldset>
        <legend>Foto do Perfil</legend>
        <div class="preview-container">
          <input id="preview-input" class="preview-input" type="file" accept="image/*">
          <label class="preview-label" for="preview-input"></label>
          <img id="preview-image" class="preview-image" src="./img/upload-icon.svg" alt="Preview da foto">
        </div>
      </fieldset>
      <fieldset>
        <legend>Dados de Identificacao</legend>

        <label for="Nome Completo">Nome Completo</label>
        <input type="text" name="" class="input" id="nome">
        <span class="erro-mensagem" id="erro-nome"></span>

        <label for="Idade">Idade</label>
        <input type="text" name="" class="input" id="idade">
        <span class="erro-mensagem" id="erro-idade"></span>
      </fieldset>

      <fieldset>
        <legend>Dados de Contato</legend>
        <label for="E-mail">E-mail</label>
        <input type="email" name="" class="input" id="email">
        <span class="erro-mensagem" id="erro-email"></span>

        <label for="Numero de Celular">Numero de Celular</label>
        <input type="tel" name="" inputmode="numeric" minlength="11" maxlength="20" class="input" id="celular">
        <span class="erro-mensagem" id="erro-celular"></span>
      </fieldset>
      
      <fieldset>
        <legend>Dados de Endereco</legend>

        <label for="Endereco">Endereço</label>
        <input type="text" name="" class="input" id="endereco">
        <span class="erro-mensagem" id="erro-endereco"></span>
        
        <label for="Cidade">Cidade</label>
        <input type="text" name="" class="input" id="cidade">
        <span class="erro-mensagem" id="erro-cidade"></span>
      </fieldset>
      
      <div class="area-botao">
        <button type="button" id="btnEnviar">Enviar Formulario</button>
        <button type="button" id="btnLimpar">Limpar Formulario</button>
      </div>
    </form>
  </div>
  
  <h2>Contatos Salvos</h2>
  <div class="div-icon">
    <div id="lista-contatos" class="contatos-lista">
      <div class="loading-mensagem">Carregando contatos...</div>
    </div>
  </div>
</body>
</html>
